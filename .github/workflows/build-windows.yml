name: Windows x64 - Build PT-BR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'art_pipeline/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar MSYS2 e dependencias
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make bash pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-lld
      - name: Compilar (sem recursos comerciais)
        run: |
          make -f Makefile-win AMD64=true RELEASE=true OPT=true -j2
      - name: Empacotar recursos livres
        run: |
          mkdir -p dist/keeperrl-ptbr
          cp keeper.exe dist/keeperrl-ptbr/
          cp -r data_free dist/keeperrl-ptbr/
          cp appconfig.txt dist/keeperrl-ptbr/
          cp COPYING.txt COPYING-MEDIA.txt LICENSE dist/keeperrl-ptbr/
          # Copia recursivamente dependencias DLL do executavel e das DLLs ja encontradas.
          # Usa objdump do toolchain MinGW e procura somente bibliotecas da instalacao MSYS2.
          cat > collect-dlls.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          dest="dist/keeperrl-ptbr"
          declare -A seen
          queue=("$dest/keeper.exe")
          while (("${#queue[@]}" > 0)); do
            binary="${queue[0]}"
            queue=("${queue[@]:1}")
            while IFS= read -r dll; do
              [[ -z "$dll" ]] && continue
              key="${dll,,}"
              [[ -n "${seen[$key]:-}" ]] && continue
              seen[$key]=1
              src=""
              for dir in /mingw64/bin /usr/bin; do
                if [[ -f "$dir/$dll" ]]; then
                  src="$dir/$dll"
                  break
                fi
              done
              [[ -z "$src" ]] && continue
              cp "$src" "$dest/"
              queue+=("$dest/$dll")
              echo "Incluida DLL: $dll"
            done < <(objdump -p "$binary" | awk '/DLL Name:/ {print $3}')
          done
          EOF
          bash collect-dlls.sh
          echo "Bibliotecas empacotadas:"
          ls -1 dist/keeperrl-ptbr/*.dll
      - name: Testar inicializacao do jogo no Windows
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE "dist/keeperrl-ptbr"
          $exe = Join-Path $folder "keeper.exe"
          $stdout = Join-Path $folder "teste-stdout.txt"
          $stderr = Join-Path $folder "teste-stderr.txt"
          Write-Host "Testando inicializacao em: $folder"
          $p = Start-Process -FilePath $exe -WorkingDirectory $folder -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if ($p.WaitForExit(15000)) {
            Write-Host "JOGO ENCERROU em menos de 15 segundos. Codigo: $($p.ExitCode)"
            $earlyExit = $true
          } else {
            Write-Host "Processo permaneceu ativo por 15 segundos (nao garante interface funcional)."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "=== STDOUT ==="
          if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
          Write-Host "=== STDERR ==="
          if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
          if ($earlyExit) { throw "Falha no teste: keeper.exe encerrou prematuramente." }
      - name: Anexar logs do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keeperrl-testes-inicializacao
          path: |
            dist/keeperrl-ptbr/teste-stdout.txt
            dist/keeperrl-ptbr/teste-stderr.txt
          if-no-files-found: ignore
      - name: Artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: keeperrl-ptbr-windows-x64-EXPERIMENTAL
          path: dist/keeperrl-ptbr/
          if-no-files-found: error
